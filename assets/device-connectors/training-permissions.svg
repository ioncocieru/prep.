<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475" role="img"><title>NTFS and share permission exhibit redrawn from the supplied PDF</title><style>text{font-family:Arial,sans-serif;fill:#263344}.label{font-size:22px;font-weight:700}.small{font-size:18px}.muted{fill:#526173}</style><rect width="900" height="475" fill="#fff"/><text x="28" y="42" class="label">Training folder — effective permissions</text><text x="28" y="74" class="small muted">Server: FS1 · Local path: D:\Projects\Training · Share: Training</text><rect x="28" y="102" width="407" height="300" rx="10" fill="#f5f7fa" stroke="#d2dae3"/><text x="46" y="138" class="label">NTFS permissions</text><text x="46" y="177" class="small">Full control</text><text x="306" y="177" class="small" font-weight="700">Not granted</text><text x="46" y="213" class="small">Modify</text><text x="306" y="213" class="small" font-weight="700">Not granted</text><text x="46" y="249" class="small">Read &amp; execute</text><text x="306" y="249" class="small" font-weight="700">Allow</text><text x="46" y="285" class="small">List folder contents</text><text x="306" y="285" class="small" font-weight="700">Allow</text><text x="46" y="321" class="small">Read</text><text x="306" y="321" class="small" font-weight="700">Allow</text><text x="46" y="357" class="small">Write / Create folders</text><text x="306" y="357" class="small" font-weight="700">Not granted</text><rect x="465" y="102" width="407" height="300" rx="10" fill="#f5f7fa" stroke="#d2dae3"/><text x="483" y="138" class="label">Share permissions</text><text x="483" y="177" class="small">Full control</text><text x="743" y="177" class="small" font-weight="700">Not granted</text><text x="483" y="213" class="small">Change</text><text x="743" y="213" class="small" font-weight="700">Not granted</text><text x="483" y="249" class="small">Read</text><text x="743" y="249" class="small" font-weight="700">Allow</text><text x="28" y="441" class="small muted">No additional grants or Deny entries apply. “Not granted” does not mean an explicit Deny.</text></svg>